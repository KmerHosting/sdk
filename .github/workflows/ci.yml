name: Catalog CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Valid JSON
        run: python -m json.tool openapi/openapi.json >/dev/null
      - name: Valid OpenAPI (structure errors fail, style warnings do not)
        run: npx -y @redocly/cli@1.34.5 lint openapi/openapi.json --format=summary
