name: Encrypt registry secrets for standalone SDK repos
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target SDK repository
        required: true
        type: choice
        options:
          - typescript-sdk
          - php-sdk
          - java-sdk
      key_id:
        description: Target repository Actions public key ID
        required: true
        type: string
      public_key:
        description: Base64 encoded target repository Actions public key
        required: true
        type: string
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pynacl==1.5.0
      - name: Encrypt secrets for the selected repository
        env:
          TARGET: ${{ inputs.target }}
          KEY_ID: ${{ inputs.key_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_KEY_NAME: ${{ secrets.MAVEN_GPG_KEY_NAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from nacl.public import PublicKey, SealedBox

          targets = {
              "typescript-sdk": ["NPM_TOKEN"],
              "php-sdk": ["PACKAGIST_USERNAME", "PACKAGIST_API_TOKEN"],
              "java-sdk": [
                  "MAVEN_USERNAME", "MAVEN_PASSWORD", "MAVEN_GPG_KEY_NAME",
                  "MAVEN_GPG_PASSPHRASE", "MAVEN_GPG_PRIVATE_KEY",
              ],
          }
          target = os.environ["TARGET"]
          if target not in targets:
              raise SystemExit("Unsupported target")
          key_id = os.environ["KEY_ID"]
          public_key = PublicKey(base64.b64decode(os.environ["PUBLIC_KEY"], validate=True))
          box = SealedBox(public_key)
          encrypted = {}
          for name in targets[target]:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"Required source secret is missing: {name}")
              encrypted[name] = {
                  "key_id": key_id,
                  "encrypted_value": base64.b64encode(box.encrypt(value.encode())).decode(),
              }
          with open("encrypted-secrets.json", "w", encoding="utf-8") as output:
              json.dump(encrypted, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-${{ inputs.target }}-secrets
          path: encrypted-secrets.json
          retention-days: 1
