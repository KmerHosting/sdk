name: Publish TypeScript SDK

on:
  workflow_dispatch:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun test && bun run typecheck && bun run build

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          if npm view "@kmerhosting/sdk@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@kmerhosting/sdk@${PACKAGE_VERSION} is already published; skipping immutable duplicate publish."
            exit 0
          fi
          npm publish --access public
