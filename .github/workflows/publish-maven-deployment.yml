name: Publish Maven Central deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Maven Central deployment UUID to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish and verify deployment
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOYMENT_ID"
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_PASSWORD"

          auth="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)"
          api="https://central.sonatype.com/api/v1/publisher"

          status() {
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST \
              --header "Authorization: Bearer $auth" \
              "$api/status?id=$DEPLOYMENT_ID"
          }

          publish() {
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST \
              --header "Authorization: Bearer $auth" \
              "$api/deployment/$DEPLOYMENT_ID"
          }

          publish_requested=0
          for attempt in {1..36}; do
            payload="$(status)"
            state="$(jq -r '.deploymentState // "UNKNOWN"' <<<"$payload")"
            echo "Maven Central deployment state: $state"

            case "$state" in
              PUBLISHED)
                exit 0
                ;;
              VALIDATED)
                if [[ "$publish_requested" -eq 0 ]]; then
                  publish
                  publish_requested=1
                  echo "Publish request accepted; waiting for Maven Central."
                else
                  echo "Publish request already accepted; waiting for Maven Central."
                fi
                ;;
              FAILED|UNKNOWN)
                echo "$payload" | jq .
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment $DEPLOYMENT_ID to become PUBLISHED."
          exit 1
